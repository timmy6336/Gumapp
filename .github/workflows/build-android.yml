name: Build Android APK

# Trigger manually from the Actions tab — gives you a download link when done.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    # Hard cap so a stuck Gradle build doesn't burn hours of Actions minutes
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Java 17 is required by the Android Gradle plugin
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install JS dependencies
        run: npm ci

      # expo prebuild generates the /android native project from app.config.ts.
      # We don't commit /android to git, so this step creates it fresh each run.
      - name: Expo Prebuild (generate Android project)
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          # Suppress Expo telemetry and login prompts in CI
          EXPO_NO_TELEMETRY: '1'

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      # This app pulls in many native modules (maps, reanimated, gesture-handler,
      # sentry, google-signin, etc). The default Gradle heap/metaspace from Expo's
      # template (-Xmx2048m -XX:MaxMetaspaceSize=512m) isn't enough for dexing +
      # resource optimization on a release build and causes a Metaspace OOM that
      # hangs Gradle instead of failing cleanly. Override with more headroom —
      # the ubuntu-latest runner has 16GB RAM.
      - name: Increase Gradle JVM memory
        run: echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties

      # assembleRelease bundles the JS into the APK (assets/index.android.bundle),
      # so the app runs standalone without needing a Metro dev server.
      # No custom keystore is configured, so Expo's template signs it with the
      # debug key — installable on any device, but not suitable for the Play Store.
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      # Upload the APK as a workflow artifact — downloadable from the Actions run page
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GumApp-release-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
